// HL2Craft stage: turn HL2's view into "viewmodel only" for the capture. Single-player developer console only.
// The demo only loads its own maps, so we stage in d1_town_01 instead of a custom map, and make the world vanish:
//   world/props/displacements/brush entities off -> HL2 clears to black;
//   whatever is still drawn is fogged pure green;
//   mat_fullbright lights the viewmodel evenly.
// hl2capture keys both black and green out.
sv_cheats 1
god
notarget
ai_disable 1
cl_drawhud 0
crosshair 0
give weapon_crowbar
give weapon_pistol
give item_ammo_pistol_large
give item_ammo_pistol_large
r_3dsky 0
r_drawskybox 0
r_drawworld 0
r_drawstaticprops 0
r_drawdisp 0
r_drawbrushmodels 0
r_drawdetailprops 0
r_drawropes 0
r_drawparticles 0
mat_fullbright 1
fog_override 1
fog_enable 1
fog_color 0 255 0
fog_start 0
fog_end 1
fog_maxdensity 1
fog_enableskybox 1
fog_colorskybox 0 255 0
fog_startskybox 0
fog_endskybox 1
fog_maxdensityskybox 1
echo "HL2CRAFT staged"
