// HL2Craft bridge. Launch HL2 with: -windowed -w 1728 -h 972 -novid -condebug +exec hl2craft
// Minecraft writes cfg/hl2craft/hc_<n>.cfg (atomic rename); each file echoes "HL2CRAFT ack <n>" and points
// hc_next at n+1, so every command runs exactly once while hc_poll re-checks every frame.
// Do not rely on "wait" inside those files to hold a button: send +x and -x in separate files.
echo "HL2CRAFT bridge loaded"

// HL2 runs behind Minecraft: keep sound and full frame rate when unfocused; no bullet decals on the key wall.
snd_mute_losefocus 0
engine_no_focus_sleep 0
r_decals 0
fps_max 120

alias hc_next "exec hl2craft/hc_0"
alias hc_poll "hc_next; wait 1; hc_poll"
hc_poll

// Stage once per HL2 launch: god/notarget are toggles, so a second exec would switch them off again.
// hc_arm re-arms it after F9 reloads the map (no nested quotes needed).
alias hc_noop echo
alias hc_stage_run "exec hl2craft_stage; alias hc_stage hc_noop"
alias hc_arm "alias hc_stage hc_stage_run"
hc_arm

// The demo only loads its own maps. Minecraft loads d1_town_01 and runs hc_stage when you first draw an HL2
// weapon (a "map" here loses to the menu's background map).
